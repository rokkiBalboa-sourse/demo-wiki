local_backend: true

backend:
  name: git-gateway
  branch: main

locale: 'ru'

media_folder: 'public/images'
public_folder: '/images'

collections:
  - name: 'module1_2026'
    label: '2026: Модуль 1'
    folder: '2026/module1'
    create: true
    slug: '{{slug}}'
    extension: 'md'
    format: 'frontmatter'
    summary: '{{title}}'
    fields:
      - { label: 'Заголовок', name: 'title', widget: 'string', required: true }
      - { label: 'Описание', name: 'description', widget: 'string', required: false }
      - { label: 'Содержимое', name: 'body', widget: 'markdown' }

  - name: 'module2_2026'
    label: '2026: Модуль 2'
    folder: '2026/module2'
    create: true
    slug: '{{slug}}'
    extension: 'md'
    format: 'frontmatter'
    summary: '{{title}}'
    fields:
      - { label: 'Заголовок', name: 'title', widget: 'string', required: true }
      - { label: 'Описание', name: 'description', widget: 'string', required: false }
      - { label: 'Содержимое', name: 'body', widget: 'markdown' }

  - name: 'module3_2026'
    label: '2026: Модуль 3'
    folder: '2026/module3'
    create: true
    slug: '{{slug}}'
    extension: 'md'
    format: 'frontmatter'
    summary: '{{title}}'
    fields:
      - { label: 'Заголовок', name: 'title', widget: 'string', required: true }
      - { label: 'Описание', name: 'description', widget: 'string', required: false }
      - { label: 'Содержимое', name: 'body', widget: 'markdown' }

  - name: 'module1_2027'
    label: '2027: Модуль 1'
    folder: '2027/module1'
    create: true
    slug: '{{slug}}'
    extension: 'md'
    format: 'frontmatter'
    summary: '{{title}}'
    fields:
      - { label: 'Заголовок', name: 'title', widget: 'string', required: true }
      - { label: 'Описание', name: 'description', widget: 'string', required: false }
      - { label: 'Содержимое', name: 'body', widget: 'markdown' }

  - name: 'pages'
    label: 'Основные страницы'
    files:
      - label: 'Главная страница (index.md)'
        name: 'home'
        file: 'index.md'
        fields:
          - { label: 'Макет', name: 'layout', widget: 'hidden', default: 'home' }
          - { label: 'Содержимое', name: 'body', widget: 'markdown', required: false }
      - label: '2026: Обзор (2026/index.md)'
        name: 'index_2026'
        file: '2026/index.md'
        fields:
          - { label: 'Заголовок', name: 'title', widget: 'string', required: true }
          - { label: 'Содержимое', name: 'body', widget: 'markdown' }
      - label: '2027: Обзор (2027/index.md)'
        name: 'index_2027'
        file: '2027/index.md'
        fields:
          - { label: 'Заголовок', name: 'title', widget: 'string', required: true }
          - { label: 'Содержимое', name: 'body', widget: 'markdown' }
